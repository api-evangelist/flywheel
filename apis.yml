apis:
- name: Flywheel Core API
  description: >-
    Full REST API for the Flywheel platform, covering the container hierarchy
    (groups, projects, subjects, sessions, acquisitions, files, analyses), gears
    and jobs, users and permissions, and search. Documented with Swagger and
    served per customer instance at <instance>/api (interactive docs at
    <instance>/api/docs). Consumed via the official Python SDK and CLI.
  humanURL: https://docs.flywheel.io/Developer_Guides/api_sdk/
