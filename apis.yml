name: Flywheel
description: >-
  Flywheel is a medical imaging data management and AI development platform for
  biomedical research, clinical trials, and medical device R&D. It securely
  ingests, organizes, de-identifies, processes, and analyzes imaging data (DICOM,
  NIfTI, and more) in a strict container hierarchy (Group, Project, Subject,
  Session, Acquisition, File, Analysis) and automates workflows with reusable
  plug-in applications called Gears. Developers integrate through a per-instance
  REST API documented with Swagger, an official Python SDK, a command line
  interface, and an open-source Developer Toolkit (fw-client, fw-file, fw-gear,
  fw-curation, fw-classification). Flywheel is HIPAA, SOC 2/SOC 3, GDPR, and
  21 CFR Part 11 compliant. Surfaced as an 8vc portfolio company and enriched by
  the API Evangelist pipeline.
